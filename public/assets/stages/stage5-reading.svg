<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <!-- Elementary School Graduation & Reading Celebration -->
  <rect width="640" height="360" fill="#F5F3FF"/>
  <!-- Cheerful Rainbow Arc -->
  <path d="M120 280 A220 220 0 0 1 520 280" stroke="#F87171" stroke-width="12" fill="none"/>
  <path d="M132 280 A208 208 0 0 1 508 280" stroke="#FBBF24" stroke-width="12" fill="none"/>
  <path d="M144 280 A196 196 0 0 1 496 280" stroke="#34D399" stroke-width="12" fill="none"/>
  <path d="M156 280 A184 184 0 0 1 484 280" stroke="#60A5FA" stroke-width="12" fill="none"/>
  <path d="M168 280 A172 172 0 0 1 472 280" stroke="#A78BFA" stroke-width="12" fill="none"/>
  <!-- Sunny School Green Ground -->
  <rect x="0" y="270" width="640" height="90" fill="#86EFAC"/>
  <!-- Golden Scholar Graduation Cap in Center -->
  <g transform="translate(280, 150)">
    <polygon points="40,20 80,40 40,60 0,40" fill="#4C1D95"/>
    <path d="M20 48 L20 70 Q40 85 60 70 L60 48 Z" fill="#312E81"/>
    <!-- Golden Tassel -->
    <line x1="40" y1="40" x2="68" y2="55" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="68" cy="58" r="4" fill="#F59E0B"/>
  </g>
  <!-- Colorful Floating Balloons -->
  <circle cx="180" cy="140" r="18" fill="#F472B6"/>
  <path d="M180 158 Q178 175 182 195" stroke="#9CA3AF" stroke-width="2" fill="none"/>
  <circle cx="460" cy="130" r="20" fill="#38BDF8"/>
  <path d="M460 150 Q462 170 458 190" stroke="#9CA3AF" stroke-width="2" fill="none"/>
</svg>
