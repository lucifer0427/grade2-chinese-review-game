<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <!-- Ancient River Harbor -->
  <rect width="640" height="360" fill="#E0E7FF"/>
  <!-- Distant Blue Mountains -->
  <path d="M0 160 Q120 100 240 150 T480 140 T640 130 L640 220 L0 220 Z" fill="#C7D2FE"/>
  <!-- Shimmering River Water -->
  <path d="M0 200 L640 200 L640 360 L0 360 Z" fill="#818CF8"/>
  <path d="M0 240 Q160 230 320 245 T640 240 L640 360 L0 360 Z" fill="#6366F1"/>
  <!-- Wooden Boat with Waterlines -->
  <path d="M160 210 L480 210 L430 270 L210 270 Z" fill="#B45309" stroke="#78350F" stroke-width="4"/>
  <!-- Clear White Waterlines Marked on Boat Hull -->
  <line x1="200" y1="240" x2="440" y2="240" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="12 8"/>
  <!-- Friendly Elephant Silhouette on Boat -->
  <ellipse cx="320" cy="165" rx="55" ry="40" fill="#9CA3AF"/>
  <circle cx="270" cy="150" r="28" fill="#9CA3AF"/>
  <!-- Elephant Trunk curved up joyfully -->
  <path d="M250 160 Q230 180 230 145" stroke="#9CA3AF" stroke-width="12" stroke-linecap="round" fill="none"/>
  <!-- Elephant Ears -->
  <ellipse cx="280" cy="145" rx="14" ry="20" fill="#D1D5DB"/>
  <circle cx="262" cy="142" r="3.5" fill="#1F2937"/>
</svg>
